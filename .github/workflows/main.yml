name: 'demo'

on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  demo:
    name: 'demo'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
    steps:
      - name: get credentials
        id: get-credentials
        uses: 'mozillazg/alibabacloud-oidc-auth@v1'
        with:
          role-arn-to-assume: '${{ secrets.ALIBABA_CLOUD_RAM_ROLE_ARN }}'
          oidc-provider-arn: '${{ secrets.ALIBABA_CLOUD_RAM_OIDC_ARN }}'
          set-outputs: 'true'

      - uses: mozillazg/ack-set-context@support-internal-endpoint
        env:
          DEBUG: 'httpx:header'
        with:
          access-key-id: ${{ steps.get-credentials.outputs.access-key-id }}
          access-key-secret: ${{ steps.get-credentials.outputs.access-key-secret }}
          security-token: ${{ steps.get-credentials.outputs.security-token }}
          cluster-id: '${{ secrets.CLUSTER_ID }}'


      - uses: mozillazg/ack-set-context@support-internal-endpoint
        env:
          DEBUG: 'httpx:header'
        with:
          access-key-id: ${{ steps.get-credentials.outputs.access-key-id }}
          access-key-secret: ${{ steps.get-credentials.outputs.access-key-secret }}
          security-token: ${{ steps.get-credentials.outputs.security-token }}
          cluster-id: '${{ secrets.CLUSTER_ID }}'
          private-ip-address: 'true'
          api-endpoint: 'https://cs.cn-hangzhou.aliyuncs.com'

      
      - uses: mozillazg/ack-set-context@support-internal-endpoint
        env:
          DEBUG: 'httpx:header'
        with:
          access-key-id: ${{ steps.get-credentials.outputs.access-key-id }}
          access-key-secret: ${{ steps.get-credentials.outputs.access-key-secret }}
          security-token: ${{ steps.get-credentials.outputs.security-token }}
          cluster-id: '${{ secrets.CLUSTER_ID_ONE }}'
          cluster-type: 'One'
      
      - uses: mozillazg/ack-set-context@support-internal-endpoint
        env:
          DEBUG: 'httpx:header'
        with:
          access-key-id: ${{ steps.get-credentials.outputs.access-key-id }}
          access-key-secret: ${{ steps.get-credentials.outputs.access-key-secret }}
          security-token: ${{ steps.get-credentials.outputs.security-token }}
          cluster-id: '${{ secrets.CLUSTER_ID_ONE }}'
          cluster-type: 'One'
          private-ip-address: 'true'
          api-endpoint: 'https://adcp.cn-beijing.aliyuncs.com'
